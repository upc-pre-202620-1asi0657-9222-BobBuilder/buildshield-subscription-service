# Perfil prod: toda la configuración sensible llega por variables de entorno, sin valores por defecto.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

buildshield:
  security:
    jwt-public-key: ${BUILDSHIELD_JWT_PUBLIC_KEY}
  payments:
    simulation-enabled: false
    success-url: ${PAYMENTS_SUCCESS_URL}
    cancel-url: ${PAYMENTS_CANCEL_URL}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
