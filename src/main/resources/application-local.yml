# Perfil local: PostgreSQL del clúster local (127.0.0.1:5433, trust) o del docker-compose de
# buildshield-platform, y Kafka de desarrollo (dev-kafka) en localhost:9092.
# La clave pública JWT llega por variable de entorno (scripts/run-all.ps1 de buildshield-platform).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:subscription_db}

buildshield:
  payments:
    # Sin STRIPE_SECRET_KEY, el pago es SIMULADO (no se cobra nada): la URL de checkout lleva a la web y el pago se
    # completa con POST /api/v1/subscriptions/checkout/{sessionId}/simulated-payment. Con la clave, Stripe real.
    simulation-enabled: ${PAYMENTS_SIMULATION_ENABLED:true}
