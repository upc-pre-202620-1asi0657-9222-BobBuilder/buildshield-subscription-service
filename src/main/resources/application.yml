spring:
  application:
    name: buildshield-subscription-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:subscription_db}
    username: ${DB_USER:subscription_service}
    password: ${DB_PASSWORD:subscription_service}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: 2000
      data-source-properties:
        options: "-c statement_timeout=${DB_STATEMENT_TIMEOUT_MS:5000} -c lock_timeout=${DB_LOCK_TIMEOUT_MS:2000}"
        connectTimeout: 5
        socketTimeout: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    admin:
      fail-fast: false
      properties:
        request.timeout.ms: 5000
        default.api.timeout.ms: 10000

server:
  # Detrás del gateway: Swagger "Try it out" usa el host del gateway (X-Forwarded-*).
  forward-headers-strategy: framework
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  default-produces-media-type: application/json
  api-docs:
    path: /api/v1/api-docs

buildshield:
  security:
    # Emisor de los tokens: los emite iam con su clave privada; este servicio solo valida con la pública.
    issuer: buildshield-iam
    jwt-public-key: ${BUILDSHIELD_JWT_PUBLIC_KEY}
    # Sin JWT: el catálogo de planes (página de inicio) y el webhook de Stripe (lo autentica su firma).
    public-endpoints:
      - GET /api/v1/plans
      - POST /api/v1/subscriptions/webhooks/stripe
  # subscription no tiene escrituras desde el celular: sin tabla idempotency_keys.
  idempotency:
    enabled: false
  messaging:
    # Publica SubscriptionActivated y SubscriptionExpired; iam los consume (organization_access).
    topic: buildshield.subscription
  subscription:
    # Duración de la prueba gratuita (plan Free) desde el registro de la organización.
    trial-days: ${SUBSCRIPTION_TRIAL_DAYS:14}
    # Cada cuánto se buscan suscripciones vencidas para publicar SubscriptionExpired.
    expiry-check-interval: ${SUBSCRIPTION_EXPIRY_CHECK_INTERVAL:PT1M}
  # Pasarela de pagos (Stripe Checkout). Las claves llegan SOLO por variables de entorno; nunca van al repositorio.
  payments:
    # El modo simulado (sin Stripe) solo lo habilita el perfil local.
    simulation-enabled: false
    success-url: ${PAYMENTS_SUCCESS_URL:http://localhost:4200/suscripcion?pago=exitoso&session_id={CHECKOUT_SESSION_ID}}
    cancel-url: ${PAYMENTS_CANCEL_URL:http://localhost:4200/suscripcion?pago=cancelado}
    simulated-checkout-url: ${PAYMENTS_SIMULATED_CHECKOUT_URL:http://localhost:4200/suscripcion/pago-simulado}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      api-base-url: ${STRIPE_API_BASE_URL:https://api.stripe.com}
      timeout: ${STRIPE_TIMEOUT:PT5S}
      webhook-tolerance: ${STRIPE_WEBHOOK_TOLERANCE:PT5M}
      # Ids de precio de Stripe (price_...). Vacíos: se envía el precio del catálogo en línea (price_data).
      prices:
        plus-monthly: ${STRIPE_PRICE_PLUS_MONTHLY:}
        plus-annual: ${STRIPE_PRICE_PLUS_ANNUAL:}
        pro-monthly: ${STRIPE_PRICE_PRO_MONTHLY:}
        pro-annual: ${STRIPE_PRICE_PRO_ANNUAL:}
